<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oiioii Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center select-none">

  <!-- Top Bar -->
  <header class="w-full max-w-md flex items-center justify-between px-4 py-2.5 bg-slate-900/90 backdrop-blur z-20 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-sm font-black text-pink-400">Oiioii Space</span>
    </div>
    <div class="flex gap-2">
      <button onclick="openModal('wardrobeModal')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-bold rounded-xl border border-slate-700">
        👗 Style
      </button>
      <button onclick="openModal('decorModal')" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 active:scale-95 text-xs font-black rounded-xl text-slate-950 shadow-md shadow-pink-500/20">
        🛋️ Decor
      </button>
    </div>
  </header>

  <!-- Viewport -->
  <main class="relative w-full max-w-md flex-1 overflow-hidden bg-slate-950">
    <canvas id="spaceCanvas" class="w-full h-full block"></canvas>

    <!-- Bottom Action Bar -->
    <div class="absolute bottom-4 inset-x-4 flex justify-between items-center pointer-events-none z-10">
      <button onclick="resetCamera()" class="pointer-events-auto px-3 py-2 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-slate-300 active:scale-95">
        Center 🎯
      </button>
      <div class="flex gap-2 pointer-events-auto">
        <button onclick="sendEmote('💖')" class="px-3 py-2 bg-slate-900/90 backdrop-blur text-base rounded-xl border border-slate-800 active:scale-95">💖</button>
        <button onclick="sendEmote('👋')" class="px-3 py-2 bg-slate-900/90 backdrop-blur text-base rounded-xl border border-slate-800 active:scale-95">👋</button>
        <button onclick="sendEmote('✨')" class="px-3 py-2 bg-slate-900/90 backdrop-blur text-base rounded-xl border border-slate-800 active:scale-95">✨</button>
      </div>
    </div>

    <!-- Wardrobe Modal -->
    <div id="wardrobeModal" class="hidden absolute inset-x-4 bottom-16 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 tracking-wider uppercase">Avatar Wardrobe</span>
        <button onclick="closeModals()" class="text-sm text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Hair:</span>
        <div class="flex gap-2">
          <button onclick="setHair('#06b6d4')" class="w-6 h-6 rounded-full bg-cyan-400 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Outfit:</span>
        <div class="flex gap-2">
          <button onclick="setOutfit('#ffffff')" class="w-6 h-6 rounded-full bg-white border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#f43f5e')" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#8b5cf6')" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
    </div>

    <!-- Decor Modal -->
    <div id="decorModal" class="hidden absolute inset-x-4 bottom-16 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 tracking-wider uppercase">Place Furniture</span>
        <button onclick="closeModals()" class="text-sm text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="grid grid-cols-4 gap-2 text-xs">
        <button onclick="addDecor('desk')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-lg">💻</span>
          <span class="text-[10px] text-slate-300">Desk</span>
        </button>
        <button onclick="addDecor('plant')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-lg">🪴</span>
          <span class="text-[10px] text-slate-300">Plant</span>
        </button>
        <button onclick="addDecor('sofa')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-lg">🛋️</span>
          <span class="text-[10px] text-slate-300">Sofa</span>
        </button>
        <button onclick="addDecor('bed')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-lg">🛏️</span>
          <span class="text-[10px] text-slate-300">Bed</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const GRID_SIZE = 8;
    const dpr = window.devicePixelRatio || 1;
    const TILE_W = 92 * dpr;
    const TILE_H = 46 * dpr;
    const WALL_H = 170 * dpr;

    const player = {
      gx: 4, gy: 4,
      targetGx: 4, targetGy: 4,
      speed: 0.08,
      isMoving: false,
      skinColor: '#fcd34d',
      hairColor: '#06b6d4',
      outfitColor: '#ffffff',
      emote: null,
      emoteTimer: 0
    };

    const furniture = [
      { type: 'desk', gx: 2, gy: 2 },
      { type: 'plant', gx: 6, gy: 1 },
      { type: 'bed', gx: 1, gy: 5 }
    ];

    function toIso(gx, gy) {
      return {
        x: (gx - gy) * (TILE_W / 2),
        y: (gx + gy) * (TILE_H / 2)
      };
    }

    function fromIso(screenX, screenY) {
      const ox = W / 2;
      const oy = (H / 2) - 20 * dpr;
      const relX = screenX - ox;
      const relY = screenY - oy;
      const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
      const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
      return { gx, gy };
    }

    function update() {
      if (player.isMoving) {
        const dx = player.targetGx - player.gx;
        const dy = player.targetGy - player.gy;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.06) {
          player.gx = player.targetGx;
          player.gy = player.targetGy;
          player.isMoving = false;
        } else {
          player.gx += (dx / dist) * player.speed;
          player.gy += (dy / dist) * player.speed;
        }
      }

      if (player.emoteTimer > 0) {
        player.emoteTimer--;
        if (player.emoteTimer <= 0) player.emote = null;
      }
    }

    function renderFurnitureItem(item, ox, oy) {
      const fIso = toIso(item.gx, item.gy);
      const fx = ox + fIso.x;
      const fy = oy + fIso.y + TILE_H / 2;

      ctx.font = `${28 * dpr}px sans-serif`;
      ctx.textAlign = 'center';

      if (item.type === 'desk') ctx.fillText('💻', fx, fy - 6 * dpr);
      else if (item.type === 'plant') ctx.fillText('🪴', fx, fy - 6 * dpr);
      else if (item.type === 'sofa') ctx.fillText('🛋️', fx, fy - 6 * dpr);
      else if (item.type === 'bed') ctx.fillText('🛏️', fx, fy - 6 * dpr);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      const ox = W / 2;
      const oy = (H / 2) - 20 * dpr;

      // 1. Isometric Walls
      const cornerTop = toIso(0, 0);
      const cornerLeft = toIso(0, GRID_SIZE);
      const cornerRight = toIso(GRID_SIZE, 0);

      // Left Wall
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Right Wall
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Wall Neon Trim
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 2.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.stroke();

      // 2. Floor Grid
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const iso = toIso(x, y);
          const px = ox + iso.x;
          const py = oy + iso.y;

          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + TILE_W / 2, py + TILE_H / 2);
          ctx.lineTo(px, py + TILE_H);
          ctx.lineTo(px - TILE_W / 2, py + TILE_H / 2);
          ctx.closePath();

          ctx.fillStyle = ((x + y) % 2 === 0) ? '#0f172a' : '#1e293b';
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1 * dpr;
          ctx.stroke();
        }
      }

      // 3. Movement Target Marker
      if (player.isMoving) {
        const tIso = toIso(player.targetGx, player.targetGy);
        const tx = ox + tIso.x;
        const ty = oy + tIso.y + TILE_H / 2;
        ctx.beginPath();
        ctx.ellipse(tx, ty, 16 * dpr, 8 * dpr, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2 * dpr;
        ctx.stroke();
      }

      // 4. Depth Sorted Entities (Avatar & Furniture)
      const renderList = [
        ...furniture.map(f => ({ type: 'furniture', data: f, depth: f.gx + f.gy })),
        { type: 'player', depth: player.gx + player.gy }
      ];

      renderList.sort((a, b) => a.depth - b.depth);

      for (let entity of renderList) {
        if (entity.type === 'furniture') {
          renderFurnitureItem(entity.data, ox, oy);
        } else {
          // Render Avatar
          const pIso = toIso(player.gx, player.gy);
          const ax = ox + pIso.x;
          const ay = oy + pIso.y + TILE_H / 2;

          // Shadow
          ctx.beginPath();
          ctx.ellipse(ax, ay, 16 * dpr, 8 * dpr, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fill();

          const walkBob = player.isMoving ? Math.sin(Date.now() * 0.02) * (4 * dpr) : 0;

          // Legs
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(ax - 6 * dpr, ay - 10 * dpr + walkBob, 4 * dpr, 9 * dpr);
          ctx.fillRect(ax + 2 * dpr, ay - 10 * dpr - walkBob, 4 * dpr, 9 * dpr);

          // Body
          ctx.fillStyle = player.outfitColor;
          ctx.beginPath();
          ctx.roundRect(ax - 10 * dpr, ay - 28 * dpr + walkBob, 20 * dpr, 18 * dpr, 5 * dpr);
          ctx.fill();

          // Head
          ctx.fillStyle = player.skinColor;
          ctx.beginPath();
          ctx.arc(ax, ay - 38 * dpr + walkBob, 12 * dpr, 0, Math.PI * 2);
          ctx.fill();

          // Hair Cap
          ctx.fillStyle = player.hairColor;
          ctx.beginPath();
          ctx.arc(ax, ay - 41 * dpr + walkBob, 13 * dpr, Math.PI, Math.PI * 2);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#000000';
          ctx.fillRect(ax - 4 * dpr, ay - 37 * dpr + walkBob, 2.5 * dpr, 3.5 * dpr);
          ctx.fillRect(ax + 2 * dpr, ay - 37 * dpr + walkBob, 2.5 * dpr, 3.5 * dpr);

          // Emote
          if (player.emote) {
            ctx.font = `${20 * dpr}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(player.emote, ax, ay - 56 * dpr + walkBob);
          }
        }
      }

      update();
      requestAnimationFrame(render);
    }

    canvas.addEventListener('pointerdown', (e) => {
      closeModals();
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const coord = fromIso(clickX, clickY);
      const tx = Math.round(coord.gx);
      const ty = Math.round(coord.gy);

      if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
        player.targetGx = tx;
        player.targetGy = ty;
        player.isMoving = true;
      }
    });

    function openModal(id) {
      closeModals();
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('wardrobeModal').classList.add('hidden');
      document.getElementById('decorModal').classList.add('hidden');
    }

    function setHair(c) { player.hairColor = c; }
    function setOutfit(c) { player.outfitColor = c; }

    function addDecor(type) {
      furniture.push({ type, gx: Math.round(player.gx), gy: Math.round(player.gy) });
      closeModals();
    }

    function sendEmote(em) {
      player.emote = em;
      player.emoteTimer = 100;
    }

    function resetCamera() {
      player.targetGx = 4;
      player.targetGy = 4;
      player.isMoving = true;
    }

    render();
  </script>
</body>
</html>
