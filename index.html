<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oiioii Space • Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-between select-none">

  <header class="w-full max-w-md flex items-center justify-between px-3 py-2 bg-slate-900/90 backdrop-blur z-20 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-black text-pink-400 tracking-wider">OIIOII SPACE</span>
      <span class="text-[9px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded font-mono">Room #101</span>
    </div>
    <div class="flex gap-1.5">
      <button onclick="toggleAudio()" id="audioBtn" class="px-2 py-1 bg-slate-800 active:scale-95 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
        🔈 Lofi
      </button>
      <button onclick="toggleModal('themeModal')" class="px-2 py-1 bg-slate-800 active:scale-95 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
        🎨 Theme
      </button>
      <button onclick="toggleModal('wardrobeModal')" class="px-2 py-1 bg-slate-800 active:scale-95 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
        👗 Style
      </button>
      <button onclick="toggleModal('decorModal')" class="px-2.5 py-1 bg-pink-500 active:scale-95 text-xs font-black rounded-xl text-slate-950 shadow-md shadow-pink-500/20">
        🛋️ Decor
      </button>
    </div>
  </header>

  <div id="placementBanner" class="hidden absolute top-14 z-30 bg-emerald-500 text-slate-950 text-xs font-black px-4 py-2 rounded-2xl shadow-xl flex items-center gap-3">
    <span>Tap floor to place item</span>
    <button onclick="rotatePending()" class="bg-slate-900 text-white px-2 py-0.5 rounded-lg text-[10px]">🔄 Rotate</button>
    <button onclick="cancelPlacement()" class="text-slate-900 font-black">✕</button>
  </div>

  <main class="relative w-full max-w-md flex-1 overflow-hidden bg-slate-950">
    <canvas id="spaceCanvas" class="w-full h-full block"></canvas>

    <div class="absolute bottom-3 inset-x-3 flex flex-col gap-2 pointer-events-none z-10">
      
      <form onsubmit="handleChat(event)" class="flex gap-1.5 pointer-events-auto">
        <input id="chatInput" type="text" placeholder="Type a message to the room..." maxlength="45" class="flex-1 bg-slate-900/90 backdrop-blur border border-slate-700 text-xs px-3 py-2 rounded-xl text-white outline-none focus:border-pink-500 placeholder-slate-500" />
        <button type="submit" class="px-4 bg-pink-500 active:scale-95 text-slate-950 font-black text-xs rounded-xl shadow-md">
          Send
        </button>
      </form>

      <div class="flex justify-between items-center">
        <div class="flex gap-1.5 pointer-events-auto">
          <button onclick="centerPlayer()" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-slate-300 active:scale-95">
            Center 🎯
          </button>
          <button onclick="spawnFriend()" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-cyan-400 active:scale-95">
            + Friend 👾
          </button>
          <button onclick="captureRoomPhoto()" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-amber-400 active:scale-95">
            📸 Snap
          </button>
          <button onclick="clearRoom()" class="px-2 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-rose-400 active:scale-95">
            🧹
          </button>
        </div>
        <div class="flex gap-1 pointer-events-auto">
          <button onclick="triggerEmote('💖')" class="px-2 py-1.5 bg-slate-900/90 backdrop-blur text-xs rounded-xl border border-slate-800 active:scale-95">💖</button>
          <button onclick="triggerEmote('👋')" class="px-2 py-1.5 bg-slate-900/90 backdrop-blur text-xs rounded-xl border border-slate-800 active:scale-95">👋</button>
          <button onclick="triggerEmote('✨')" class="px-2 py-1.5 bg-slate-900/90 backdrop-blur text-xs rounded-xl border border-slate-800 active:scale-95">✨</button>
          <button onclick="triggerEmote('🔥')" class="px-2 py-1.5 bg-slate-900/90 backdrop-blur text-xs rounded-xl border border-slate-800 active:scale-95">🔥</button>
        </div>
      </div>
    </div>

    <div id="wardrobeModal" class="hidden absolute inset-x-3 bottom-24 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Avatar Studio</span>
        <button onclick="toggleModal('wardrobeModal')" class="text-xs text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Hair:</span>
        <div class="flex gap-2">
          <button onclick="setHair('#06b6d4')" class="w-6 h-6 rounded-full bg-cyan-400 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Outfit:</span>
        <div class="flex gap-2">
          <button onclick="setOutfit('#ffffff')" class="w-6 h-6 rounded-full bg-white border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#f43f5e')" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#8b5cf6')" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#0f172a')" class="w-6 h-6 rounded-full bg-slate-900 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
    </div>

    <div id="themeModal" class="hidden absolute inset-x-3 bottom-24 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Room Architecture & Colors</span>
        <button onclick="toggleModal('themeModal')" class="text-xs text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2 text-xs">
        <button onclick="setRoomTheme('cyber')" class="p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-center font-bold">🌌 Cyberpunk</button>
        <button onclick="setRoomTheme('wood')" class="p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-center font-bold">🪵 Warm Loft</button>
        <button onclick="setRoomTheme('mint')" class="p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-center font-bold">🌿 Pastel Mint</button>
      </div>
    </div>

    <div id="decorModal" class="hidden absolute inset-x-3 bottom-24 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Place Isometric 3D Item</span>
        <button onclick="toggleModal('decorModal')" class="text-xs text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="grid grid-cols-4 gap-2 text-xs">
        <button onclick="startPlacement('desk')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🖥️</span>
          <span class="text-[9px] text-slate-300">Desk</span>
        </button>
        <button onclick="startPlacement('bed')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🛏️</span>
          <span class="text-[9px] text-slate-300">Bed</span>
        </button>
        <button onclick="startPlacement('sofa')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🛋️</span>
          <span class="text-[9px] text-slate-300">Sofa</span>
        </button>
        <button onclick="startPlacement('plant')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🪴</span>
          <span class="text-[9px] text-slate-300">Monstera</span>
        </button>
        <button onclick="startPlacement('chair')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🪑</span>
          <span class="text-[9px] text-slate-300">Chair</span>
        </button>
        <button onclick="startPlacement('arcade')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">🕹️</span>
          <span class="text-[9px] text-slate-300">Arcade</span>
        </button>
        <button onclick="startPlacement('shelf')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">📚</span>
          <span class="text-[9px] text-slate-300">Bookshelf</span>
        </button>
        <button onclick="startPlacement('lamp')" class="p-2 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-base">💡</span>
          <span class="text-[9px] text-slate-300">Lamp</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const GRID_SIZE = 8;
    const dpr = window.devicePixelRatio || 1;
    // Edge-to-edge room tile sizing
    const TILE_W = 104 * dpr;
    const TILE_H = 52 * dpr;
    const WALL_H = 240 * dpr;

    // Persisted State
    const savedHair = localStorage.getItem('oiioii_hair') || '#06b6d4';
    const savedOutfit = localStorage.getItem('oiioii_outfit') || '#ffffff';
    const savedTheme = localStorage.getItem('oiioii_theme') || 'cyber';
    const savedFurniture = localStorage.getItem('oiioii_decor');

    let currentTheme = savedTheme;
    let pendingItemType = null;
    let pendingRot = 0;
    let hoveredGrid = null;

    const player = {
      name: 'You',
      gx: 4, gy: 4,
      targetGx: 4, targetGy: 4,
      speed: 0.08,
      direction: 'S',
      isMoving: false,
      isSitting: false,
      isGaming: false,
      skinColor: '#fcd34d',
      hairColor: savedHair,
      outfitColor: savedOutfit,
      bubbleText: null,
      bubbleTimer: 0,
      emote: null,
      emoteTimer: 0
    };

    let friends = [];

    let furniture = savedFurniture ? JSON.parse(savedFurniture) : [
      { type: 'desk', gx: 2, gy: 2, rot: 0 },
      { type: 'chair', gx: 2, gy: 3, rot: 0 },
      { type: 'bed', gx: 1, gy: 5, rot: 0 },
      { type: 'plant', gx: 6, gy: 1, rot: 0 },
      { type: 'arcade', gx: 5, gy: 2, rot: 0 },
      { type: 'sofa', gx: 5, gy: 5, rot: 0 }
    ];

    const motes = Array.from({ length: 24 }, () => ({
      x: Math.random() * 1000,
      y: Math.random() * 1000,
      r: (Math.random() * 1.6 + 0.6) * dpr,
      speed: Math.random() * 0.35 + 0.2
    }));

    // City skyline traffic animation
    let trafficX = 0;

    function saveDecorState() {
      localStorage.setItem('oiioii_decor', JSON.stringify(furniture));
    }

    function toIso(gx, gy) {
      return {
        x: (gx - gy) * (TILE_W / 2),
        y: (gx + gy) * (TILE_H / 2)
      };
    }

    function fromIso(screenX, screenY) {
      const ox = W / 2;
      const oy = (H / 2) + 20 * dpr;
      const relX = screenX - ox;
      const relY = screenY - oy;
      const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
      const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
      return { gx, gy };
    }

    // Audio Synthesizer
    let audioCtx = null;
    let isPlayingAudio = false;
    let audioInterval = null;

    function toggleAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isPlayingAudio = !isPlayingAudio;
      document.getElementById('audioBtn').innerText = isPlayingAudio ? '🔊 Lofi' : '🔈 Lofi';
      
      if (isPlayingAudio) {
        audioInterval = setInterval(() => {
          if (!isPlayingAudio) return;
          const chords = [261.63, 329.63, 392.00, 523.25];
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(chords[Math.floor(Math.random() * chords.length)], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 2.4);
        }, 1600);
      } else {
        clearInterval(audioInterval);
      }
    }

    function setRoomTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('oiioii_theme', theme);
      toggleModal('themeModal');
    }

    function spawnFriend() {
      if (friends.length >= 4) {
        alert("Room is cozy! Max 4 friends.");
        return;
      }
      const names = ['Kai', 'Mika', 'Leo', 'Nova'];
      friends.push({
        name: names[friends.length],
        gx: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
        gy: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
        targetGx: 4, targetGy: 4,
        speed: 0.05,
        direction: 'S',
        isMoving: false,
        isSitting: false,
        hairColor: ['#f59e0b', '#10b981', '#ec4899', '#a855f7'][friends.length],
        outfitColor: ['#1e293b', '#06b6d4', '#f43f5e', '#3b82f6'][friends.length],
        bubbleText: 'Oiioii! ✨',
        bubbleTimer: 150
      });
    }

    function clearRoom() {
      friends = [];
      furniture = [];
      saveDecorState();
    }

    function update() {
      trafficX = (trafficX + 0.5) % 120;

      // Player Movement & Sitting Detection
      if (player.isMoving) {
        const dx = player.targetGx - player.gx;
        const dy = player.targetGy - player.gy;
        const dist = Math.hypot(dx, dy);

        if (Math.abs(dx) > Math.abs(dy)) {
          player.direction = dx > 0 ? 'E' : 'W';
        } else {
          player.direction = dy > 0 ? 'S' : 'N';
        }

        if (dist < 0.06) {
          player.gx = player.targetGx;
          player.gy = player.targetGy;
          player.isMoving = false;

          const currentTile = furniture.find(f => f.gx === Math.round(player.gx) && f.gy === Math.round(player.gy));
          player.isSitting = currentTile && (currentTile.type === 'sofa' || currentTile.type === 'bed' || currentTile.type === 'chair');
          player.isGaming = currentTile && (currentTile.type === 'arcade');
        } else {
          player.gx += (dx / dist) * player.speed;
          player.gy += (dy / dist) * player.speed;
          player.isSitting = false;
          player.isGaming = false;
        }
      }

      // Friends Autonomous AI
      for (let f of friends) {
        if (!f.isMoving && Math.random() < 0.012) {
          f.targetGx = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
          f.targetGy = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
          f.isMoving = true;
        }
        if (f.isMoving) {
          const dx = f.targetGx - f.gx;
          const dy = f.targetGy - f.gy;
          const dist = Math.hypot(dx, dy);
          f.direction = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N');

          if (dist < 0.06) {
            f.gx = f.targetGx;
            f.gy = f.targetGy;
            f.isMoving = false;
          } else {
            f.gx += (dx / dist) * f.speed;
            f.gy += (dy / dist) * f.speed;
          }
        }
        if (f.bubbleTimer > 0) f.bubbleTimer--;
      }

      if (player.bubbleTimer > 0) player.bubbleTimer--;
      if (player.emoteTimer > 0) player.emoteTimer--;

      for (let m of motes) {
        m.y -= m.speed;
        if (m.y < 0) m.y = H;
      }
    }

    // High-Resolution 3D Furniture Rendering
    function render3DFurniture(item, ox, oy) {
      const fIso = toIso(item.gx, item.gy);
      const fx = ox + fIso.x;
      const fy = oy + fIso.y + TILE_H / 2;

      ctx.save();

      if (item.type === 'desk') {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(fx, fy, 32 * dpr, 16 * dpr, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(fx - 28 * dpr, fy - 30 * dpr, 4 * dpr, 26 * dpr);
        ctx.fillRect(fx + 24 * dpr, fy - 30 * dpr, 4 * dpr, 26 * dpr);

        ctx.fillStyle = currentTheme === 'wood' ? '#78350f' : '#334155';
        ctx.beginPath();
        ctx.moveTo(fx, fy - 22 * dpr);
        ctx.lineTo(fx + 34 * dpr, fy - 39 * dpr);
        ctx.lineTo(fx, fy - 56 * dpr);
        ctx.lineTo(fx - 34 * dpr, fy - 39 * dpr);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(fx - 16 * dpr, fy - 68 * dpr, 32 * dpr, 18 * dpr);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fx - 14 * dpr, fy - 66 * dpr, 28 * dpr, 14 * dpr);
      } 
      else if (item.type === 'chair') {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(fx, fy, 14 * dpr, 7 * dpr, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(fx - 3 * dpr, fy - 20 * dpr, 6 * dpr, 18 * dpr);

        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.roundRect(fx - 14 * dpr, fy - 42 * dpr, 28 * dpr, 28 * dpr, 6 * dpr);
        ctx.fill();
      }
      else if (item.type === 'bed') {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + 40 * dpr, fy - 20 * dpr);
        ctx.lineTo(fx, fy - 40 * dpr);
        ctx.lineTo(fx - 40 * dpr, fy - 20 * dpr);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.moveTo(fx, fy - 8 * dpr);
        ctx.lineTo(fx + 36 * dpr, fy - 26 * dpr);
        ctx.lineTo(fx, fy - 44 * dpr);
        ctx.lineTo(fx - 36 * dpr, fy - 26 * dpr);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fx - 22 * dpr, fy - 44 * dpr, 18 * dpr, 9 * dpr);
        ctx.fillRect(fx + 4 * dpr, fy - 44 * dpr, 18 * dpr, 9 * dpr);
      } 
      else if (item.type === 'sofa') {
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        ctx.roundRect(fx - 32 * dpr, fy - 36 * dpr, 64 * dpr, 30 * dpr, 8 * dpr);
        ctx.fill();
        ctx.fillStyle = '#6366f1';
        ctx.beginPath();
        ctx.roundRect(fx - 28 * dpr, fy - 28 * dpr, 56 * dpr, 20 * dpr, 6 * dpr);
        ctx.fill();
      } 
      else if (item.type === 'plant') {
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(fx, fy - 12 * dpr, 12 * dpr, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(fx - 8 * dpr, fy - 28 * dpr, 12 * dpr, 0, Math.PI * 2);
        ctx.arc(fx + 8 * dpr, fy - 32 * dpr, 14 * dpr, 0, Math.PI * 2);
        ctx.arc(fx, fy - 40 * dpr, 15 * dpr, 0, Math.PI * 2);
        ctx.fill();
      }
      else if (item.type === 'arcade') {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(fx - 16 * dpr, fy - 65 * dpr, 32 * dpr, 60 * dpr);
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(fx - 14 * dpr, fy - 60 * dpr, 28 * dpr, 8 * dpr);
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(fx - 12 * dpr, fy - 46 * dpr, 24 * dpr, 18 * dpr);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(fx, fy - 20 * dpr, 4 * dpr, 0, Math.PI * 2);
        ctx.fill();
      }
      else if (item.type === 'shelf') {
        ctx.fillStyle = currentTheme === 'wood' ? '#451a03' : '#854d0e';
        ctx.fillRect(fx - 18 * dpr, fy - 55 * dpr, 36 * dpr, 50 * dpr);
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(fx - 14 * dpr, fy - 48 * dpr, 8 * dpr, 12 * dpr);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fx - 4 * dpr, fy - 48 * dpr, 8 * dpr, 12 * dpr);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(fx + 6 * dpr, fy - 30 * dpr, 8 * dpr, 12 * dpr);
      }
      else if (item.type === 'lamp') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(fx - 4 * dpr, fy - 12 * dpr, 8 * dpr, 6 * dpr);
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.roundRect(fx - 6 * dpr, fy - 42 * dpr, 12 * dpr, 28 * dpr, 6 * dpr);
        ctx.fill();
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 18 * dpr;
      }

      ctx.restore();
    }

    // Avatar Rendering with Directional Facing & Badges
    function renderAvatar(char, isSelf, ox, oy) {
      const pIso = toIso(char.gx, char.gy);
      const ax = ox + pIso.x;
      const ay = oy + pIso.y + TILE_H / 2;

      ctx.beginPath();
      ctx.ellipse(ax, ay, 18 * dpr, 9 * dpr, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fill();

      const walkBob = char.isMoving ? Math.sin(Date.now() * 0.02) * (4 * dpr) : 0;
      const sitOffset = char.isSitting ? 10 * dpr : 0;

      // Legs
      if (!char.isSitting) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(ax - 7 * dpr, ay - 11 * dpr + walkBob, 5 * dpr, 10 * dpr);
        ctx.fillRect(ax + 2 * dpr, ay - 11 * dpr - walkBob, 5 * dpr, 10 * dpr);
      }

      // Body / Outfit
      ctx.fillStyle = char.outfitColor;
      ctx.beginPath();
      ctx.roundRect(ax - 12 * dpr, ay - 32 * dpr + walkBob + sitOffset, 24 * dpr, 22 * dpr, 6 * dpr);
      ctx.fill();

      // Head
      ctx.fillStyle = char.skinColor || '#fcd34d';
      ctx.beginPath();
      ctx.arc(ax, ay - 44 * dpr + walkBob + sitOffset, 14 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // Hair Direction
      ctx.fillStyle = char.hairColor;
      if (char.direction === 'N') {
        ctx.beginPath();
        ctx.arc(ax, ay - 45 * dpr + walkBob + sitOffset, 15 * dpr, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(ax, ay - 48 * dpr + walkBob + sitOffset, 15 * dpr, Math.PI, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000000';
        if (char.direction === 'S') {
          ctx.fillRect(ax - 5 * dpr, ay - 43 * dpr + walkBob + sitOffset, 3 * dpr, 4 * dpr);
          ctx.fillRect(ax + 2 * dpr, ay - 43 * dpr + walkBob + sitOffset, 3 * dpr, 4 * dpr);
        } else if (char.direction === 'E') {
          ctx.fillRect(ax + 4 * dpr, ay - 43 * dpr + walkBob + sitOffset, 3 * dpr, 4 * dpr);
        } else if (char.direction === 'W') {
          ctx.fillRect(ax - 7 * dpr, ay - 43 * dpr + walkBob + sitOffset, 3 * dpr, 4 * dpr);
        }
      }

      // Name Badge
      ctx.font = `bold ${8 * dpr}px sans-serif`;
      ctx.fillStyle = isSelf ? '#ec4899' : '#06b6d4';
      ctx.textAlign = 'center';
      ctx.fillText(char.name || 'Friend', ax, ay - 60 * dpr + walkBob + sitOffset);

      // Emote
      if (char.emoteTimer > 0) {
        ctx.font = `${24 * dpr}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(char.emote, ax, ay - 72 * dpr + walkBob + sitOffset);
      }

      // Speech Bubble
      if (char.bubbleTimer > 0 && char.bubbleText) {
        ctx.font = `bold ${10 * dpr}px sans-serif`;
        const textWidth = ctx.measureText(char.bubbleText).width;
        const bubbleW = textWidth + 18 * dpr;
        const bubbleH = 24 * dpr;
        const bx = ax - bubbleW / 2;
        const by = ay - 88 * dpr + walkBob + sitOffset;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.strokeStyle = isSelf ? '#ec4899' : '#06b6d4';
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath();
        ctx.roundRect(bx, by, bubbleW, bubbleH, 7 * dpr);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(char.bubbleText, ax, by + 16 * dpr);
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      const ox = W / 2;
      const oy = (H / 2) + 20 * dpr;

      // Theme Colors
      let wallLeft = '#1e1b4b', wallRight = '#2e1065', tileA = '#0f172a', tileB = '#1e293b', trimColor = '#ec4899';
      if (currentTheme === 'wood') {
        wallLeft = '#3f2e20'; wallRight = '#4a3525'; tileA = '#78350f'; tileB = '#92400e'; trimColor = '#f59e0b';
      } else if (currentTheme === 'mint') {
        wallLeft = '#064e3b'; wallRight = '#065f46'; tileA = '#022c22'; tileB = '#044e3d'; trimColor = '#10b981';
      }

      // Isometric Walls
      const cornerTop = toIso(0, 0);
      const cornerLeft = toIso(0, GRID_SIZE);
      const cornerRight = toIso(GRID_SIZE, 0);

      // Left Wall
      ctx.fillStyle = wallLeft;
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Right Wall
      ctx.fillStyle = wallRight;
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Animated Cyber Window with Moving Skyline Glow
      const winGrad = ctx.createLinearGradient(ox - 70 * dpr, oy - 140 * dpr, ox - 10 * dpr, oy - 50 * dpr);
      winGrad.addColorStop(0, 'rgba(6, 182, 212, 0.55)');
      winGrad.addColorStop(1, 'rgba(236, 72, 153, 0.35)');
      ctx.fillStyle = winGrad;
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(ox - 70 * dpr, oy - 140 * dpr);
      ctx.lineTo(ox - 10 * dpr, oy - 110 * dpr);
      ctx.lineTo(ox - 10 * dpr, oy - 50 * dpr);
      ctx.lineTo(ox - 70 * dpr, oy - 80 * dpr);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Passing Aerial Light Streak in window
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fillRect(ox - 65 * dpr + (trafficX * dpr * 0.45), oy - 100 * dpr + (trafficX * dpr * 0.22), 4 * dpr, 1.5 * dpr);

      // Neon Seam Trim
      ctx.strokeStyle = trimColor;
      ctx.lineWidth = 3 * dpr;
      ctx.beginPath();
      ctx.moveTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.stroke();

      // Floor Grid Tiles
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const iso = toIso(x, y);
          const px = ox + iso.x;
          const py = oy + iso.y;

          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + TILE_W / 2, py + TILE_H / 2);
          ctx.lineTo(px, py + TILE_H);
          ctx.lineTo(px - TILE_W / 2, py + TILE_H / 2);
          ctx.closePath();

          if (pendingItemType && hoveredGrid && hoveredGrid.gx === x && hoveredGrid.gy === y) {
            ctx.fillStyle = 'rgba(16, 185, 129, 0.55)';
            ctx.fill();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2.5 * dpr;
            ctx.stroke();
          } else {
            ctx.fillStyle = ((x + y) % 2 === 0) ? tileA : tileB;
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1 * dpr;
            ctx.stroke();
          }
        }
      }

      // Ambient Dust Particles
      ctx.fillStyle = 'rgba(236, 72, 153, 0.4)';
      for (let m of motes) {
        ctx.beginPath();
        ctx.arc(m.x % W, m.y % H, m.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Movement Destination Ring
      if (player.isMoving) {
        const tIso = toIso(player.targetGx, player.targetGy);
        const tx = ox + tIso.x;
        const ty = oy + tIso.y + TILE_H / 2;
        ctx.beginPath();
        ctx.ellipse(tx, ty, 18 * dpr, 9 * dpr, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2 * dpr;
        ctx.stroke();
      }

      // Depth-Sorted World Entities
      const renderList = [
        ...furniture.map(f => ({ type: 'furniture', data: f, depth: f.gx + f.gy })),
        ...friends.map(fr => ({ type: 'friend', data: fr, depth: fr.gx + fr.gy })),
        { type: 'player', data: player, depth: player.gx + player.gy }
      ];

      renderList.sort((a, b) => a.depth - b.depth);

      for (let ent of renderList) {
        if (ent.type === 'furniture') {
          render3DFurniture(ent.data, ox, oy);
        } else if (ent.type === 'friend') {
          renderAvatar(ent.data, false, ox, oy);
        } else {
          renderAvatar(ent.data, true, ox, oy);
        }
      }

      update();
      requestAnimationFrame(render);
    }

    // Pointer Handlers
    canvas.addEventListener('pointermove', (e) => {
      if (!pendingItemType) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
      const coord = fromIso(clickX, clickY);
      hoveredGrid = { gx: Math.round(coord.gx), gy: Math.round(coord.gy) };
    });

    canvas.addEventListener('pointerdown', (e) => {
      closeAllModals();
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const coord = fromIso(clickX, clickY);
      const tx = Math.round(coord.gx);
      const ty = Math.round(coord.gy);

      if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
        if (pendingItemType) {
          furniture.push({ type: pendingItemType, gx: tx, gy: ty, rot: pendingRot });
          saveDecorState();
          cancelPlacement();
          return;
        }

        const hitIndex = furniture.findIndex(f => f.gx === tx && f.gy === ty);
        if (hitIndex !== -1 && hitIndex !== null) {
          const action = prompt(`Item: ${furniture[hitIndex].type}\nType 'del' to remove, or 'rot' to turn 90°:`, 'rot');
          if (action === 'del') {
            furniture.splice(hitIndex, 1);
            saveDecorState();
          } else if (action === 'rot') {
            furniture[hitIndex].rot = ((furniture[hitIndex].rot || 0) + 1) % 4;
            saveDecorState();
          }
          return;
        }

        player.targetGx = tx;
        player.targetGy = ty;
        player.isMoving = true;
      }
    });

    function startPlacement(type) {
      pendingItemType = type;
      closeAllModals();
      document.getElementById('placementBanner').classList.remove('hidden');
    }

    function rotatePending() {
      pendingRot = (pendingRot + 1) % 4;
    }

    function cancelPlacement() {
      pendingItemType = null;
      hoveredGrid = null;
      document.getElementById('placementBanner').classList.add('hidden');
    }

    function toggleModal(id) {
      const el = document.getElementById(id);
      const isHidden = el.classList.contains('hidden');
      closeAllModals();
      if (isHidden) el.classList.remove('hidden');
    }

    function closeAllModals() {
      document.getElementById('wardrobeModal').classList.add('hidden');
      document.getElementById('decorModal').classList.add('hidden');
      document.getElementById('themeModal').classList.add('hidden');
    }

    function setHair(c) {
      player.hairColor = c;
      localStorage.setItem('oiioii_hair', c);
    }

    function setOutfit(c) {
      player.outfitColor = c;
      localStorage.setItem('oiioii_outfit', c);
    }

    function triggerEmote(em) {
      player.emote = em;
      player.emoteTimer = 90;
    }

    function handleChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (val) {
        player.bubbleText = val;
        player.bubbleTimer = 180;
        input.value = '';

        if (friends.length > 0) {
          setTimeout(() => {
            const randomFriend = friends[Math.floor(Math.random() * friends.length)];
            const replies = ['Love this room! ✨', 'Sitting right here! 🛋️', 'Vibing with the music 🎶', 'Oiioii! 🔥', 'Looking good!'];
            randomFriend.bubbleText = replies[Math.floor(Math.random() * replies.length)];
            randomFriend.bubbleTimer = 180;
          }, 900);
        }
      }
    }

    function centerPlayer() {
      player.targetGx = 4;
      player.targetGy = 4;
      player.isMoving = true;
    }

    function captureRoomPhoto() {
      const link = document.createElement('a');
      link.download = `oiioii-room-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    render();
  </script>
</body>
