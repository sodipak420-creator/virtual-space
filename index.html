<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oiioii Space • Virtual Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-between select-none">

  <header class="w-full max-w-md flex items-center justify-between px-4 py-2 bg-slate-900/90 backdrop-blur z-20 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-black text-pink-400 tracking-wider">OIIOII SPACE</span>
      <span class="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded font-mono">Room #101</span>
    </div>
    <div class="flex gap-1.5">
      <button onclick="toggleAudio()" id="audioBtn" class="px-2.5 py-1.5 bg-slate-800 active:scale-95 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
        🔈 Lofi
      </button>
      <button onclick="toggleModal('wardrobeModal')" class="px-2.5 py-1.5 bg-slate-800 active:scale-95 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
        👗 Style
      </button>
      <button onclick="toggleModal('decorModal')" class="px-2.5 py-1.5 bg-pink-500 active:scale-95 text-xs font-black rounded-xl text-slate-950 shadow-md shadow-pink-500/20">
        🛋️ Decor
      </button>
    </div>
  </header>

  <main class="relative w-full max-w-md flex-1 overflow-hidden bg-slate-950">
    <canvas id="spaceCanvas" class="w-full h-full block"></canvas>

    <div class="absolute bottom-3 inset-x-3 flex flex-col gap-2 pointer-events-none z-10">
      
      <form onsubmit="handleChat(event)" class="flex gap-1.5 pointer-events-auto">
        <input id="chatInput" type="text" placeholder="Type a message..." maxlength="40" class="flex-1 bg-slate-900/90 backdrop-blur border border-slate-700 text-xs px-3 py-2 rounded-xl text-white outline-none focus:border-pink-500 placeholder-slate-500" />
        <button type="submit" class="px-4 bg-pink-500 active:scale-95 text-slate-950 font-black text-xs rounded-xl shadow-md">
          Send
        </button>
      </form>

      <div class="flex justify-between items-center">
        <div class="flex gap-1.5 pointer-events-auto">
          <button onclick="centerPlayer()" class="px-3 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-slate-300 active:scale-95">
            Center 🎯
          </button>
          <button onclick="spawnFriend()" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-cyan-400 active:scale-95">
            + Friend 👾
          </button>
          <button onclick="clearRoom()" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-xs font-bold rounded-xl border border-slate-800 text-rose-400 active:scale-95">
            Reset 🧹
          </button>
        </div>
        <div class="flex gap-1.5 pointer-events-auto">
          <button onclick="triggerEmote('💖')" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-sm rounded-xl border border-slate-800 active:scale-95">💖</button>
          <button onclick="triggerEmote('👋')" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-sm rounded-xl border border-slate-800 active:scale-95">👋</button>
          <button onclick="triggerEmote('✨')" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-sm rounded-xl border border-slate-800 active:scale-95">✨</button>
          <button onclick="triggerEmote('🔥')" class="px-2.5 py-1.5 bg-slate-900/90 backdrop-blur text-sm rounded-xl border border-slate-800 active:scale-95">🔥</button>
        </div>
      </div>
    </div>

    <div id="wardrobeModal" class="hidden absolute inset-x-3 bottom-24 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Avatar Studio</span>
        <button onclick="toggleModal('wardrobeModal')" class="text-xs text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Hair:</span>
        <div class="flex gap-2">
          <button onclick="setHair('#06b6d4')" class="w-6 h-6 rounded-full bg-cyan-400 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setHair('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-300">Outfit:</span>
        <div class="flex gap-2">
          <button onclick="setOutfit('#ffffff')" class="w-6 h-6 rounded-full bg-white border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#f43f5e')" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#8b5cf6')" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 active:scale-90"></button>
          <button onclick="setOutfit('#0f172a')" class="w-6 h-6 rounded-full bg-slate-900 border-2 border-white/50 active:scale-90"></button>
        </div>
      </div>
    </div>

    <div id="decorModal" class="hidden absolute inset-x-3 bottom-24 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-pink-500/40 shadow-2xl space-y-3 z-30">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Place 3D Furniture</span>
        <button onclick="toggleModal('decorModal')" class="text-xs text-slate-400 px-2 py-0.5">✕</button>
      </div>
      <div class="grid grid-cols-4 gap-2 text-xs">
        <button onclick="addFurniture('desk')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-xl">🖥️</span>
          <span class="text-[10px] text-slate-300">Workstation</span>
        </button>
        <button onclick="addFurniture('bed')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-xl">🛏️</span>
          <span class="text-[10px] text-slate-300">Cozy Bed</span>
        </button>
        <button onclick="addFurniture('sofa')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-xl">🛋️</span>
          <span class="text-[10px] text-slate-300">Lounge</span>
        </button>
        <button onclick="addFurniture('plant')" class="p-2.5 bg-slate-800 active:bg-slate-700 rounded-xl border border-slate-700 flex flex-col items-center gap-1">
          <span class="text-xl">🪴</span>
          <span class="text-[10px] text-slate-300">Monstera</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const GRID_SIZE = 8;
    const dpr = window.devicePixelRatio || 1;
    const TILE_W = 92 * dpr;
    const TILE_H = 46 * dpr;
    const WALL_H = 190 * dpr;

    // Persisted Avatar & Furniture
    const savedHair = localStorage.getItem('oiioii_hair') || '#06b6d4';
    const savedOutfit = localStorage.getItem('oiioii_outfit') || '#ffffff';
    const savedFurniture = localStorage.getItem('oiioii_decor');

    const player = {
      gx: 4, gy: 4,
      targetGx: 4, targetGy: 4,
      speed: 0.08,
      isMoving: false,
      isSitting: false,
      skinColor: '#fcd34d',
      hairColor: savedHair,
      outfitColor: savedOutfit,
      bubbleText: null,
      bubbleTimer: 0,
      emote: null,
      emoteTimer: 0
    };

    let friends = [];

    let furniture = savedFurniture ? JSON.parse(savedFurniture) : [
      { type: 'desk', gx: 2, gy: 2 },
      { type: 'bed', gx: 1, gy: 5 },
      { type: 'plant', gx: 6, gy: 1 },
      { type: 'sofa', gx: 5, gy: 5 }
    ];

    const motes = Array.from({ length: 22 }, () => ({
      x: Math.random() * 1000,
      y: Math.random() * 1000,
      r: (Math.random() * 1.5 + 0.5) * dpr,
      speed: Math.random() * 0.35 + 0.2
    }));

    function saveDecorState() {
      localStorage.setItem('oiioii_decor', JSON.stringify(furniture));
    }

    function toIso(gx, gy) {
      return {
        x: (gx - gy) * (TILE_W / 2),
        y: (gx + gy) * (TILE_H / 2)
      };
    }

    function fromIso(screenX, screenY) {
      const ox = W / 2;
      const oy = (H / 2) - 10 * dpr;
      const relX = screenX - ox;
      const relY = screenY - oy;
      const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
      const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
      return { gx, gy };
    }

    // Generative Lo-Fi Audio Engine
    let audioCtx = null;
    let isPlayingAudio = false;
    let audioInterval = null;

    function toggleAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isPlayingAudio = !isPlayingAudio;
      document.getElementById('audioBtn').innerText = isPlayingAudio ? '🔊 Lofi' : '🔈 Lofi';
      
      if (isPlayingAudio) {
        audioInterval = setInterval(() => {
          if (!isPlayingAudio) return;
          const chords = [261.63, 329.63, 392.00, 523.25];
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(chords[Math.floor(Math.random() * chords.length)], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 2.4);
        }, 1600);
      } else {
        clearInterval(audioInterval);
      }
    }

    // 2. Anti-Crowd Friend Cap (Max 4)
    function spawnFriend() {
      if (friends.length >= 4) {
        alert("Room capacity reached! Max 4 visitor friends.");
        return;
      }
      const names = ['Kai', 'Mika', 'Leo', 'Nova'];
      friends.push({
        name: names[friends.length],
        gx: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
        gy: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
        targetGx: 4, targetGy: 4,
        speed: 0.05,
        isMoving: false,
        hairColor: ['#f59e0b', '#10b981', '#ec4899', '#a855f7'][friends.length],
        outfitColor: ['#1e293b', '#06b6d4', '#f43f5e', '#3b82f6'][friends.length],
        bubbleText: 'Oiioii! ✨',
        bubbleTimer: 150
      });
    }

    function clearRoom() {
      friends = [];
      furniture = [];
      saveDecorState();
    }

    function update() {
      // Player Movement & Sitting Check
      if (player.isMoving) {
        const dx = player.targetGx - player.gx;
        const dy = player.targetGy - player.gy;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.06) {
          player.gx = player.targetGx;
          player.gy = player.targetGy;
          player.isMoving = false;

          // 3. Sitting detection on Beds / Lounges
          const seat = furniture.find(f => f.gx === Math.round(player.gx) && f.gy === Math.round(player.gy) && (f.type === 'sofa' || f.type === 'bed'));
          player.isSitting = !!seat;
        } else {
          player.gx += (dx / dist) * player.speed;
          player.gy += (dy / dist) * player.speed;
          player.isSitting = false;
        }
      }

      // Friends Autonomous AI
      for (let f of friends) {
        if (!f.isMoving && Math.random() < 0.012) {
          f.targetGx = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
          f.targetGy = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
          f.isMoving = true;
        }
        if (f.isMoving) {
          const dx = f.targetGx - f.gx;
          const dy = f.targetGy - f.gy;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.06) {
            f.gx = f.targetGx;
            f.gy = f.targetGy;
            f.isMoving = false;
          } else {
            f.gx += (dx / dist) * f.speed;
            f.gy += (dy / dist) * f.speed;
          }
        }
        if (f.bubbleTimer > 0) f.bubbleTimer--;
      }

      if (player.bubbleTimer > 0) player.bubbleTimer--;
      if (player.emoteTimer > 0) player.emoteTimer--;

      for (let m of motes) {
        m.y -= m.speed;
        if (m.y < 0) m.y = H;
      }
    }

    // 1. True Vector Isometric 3D Furniture
    function render3DFurniture(item, ox, oy) {
      const fIso = toIso(item.gx, item.gy);
      const fx = ox + fIso.x;
      const fy = oy + fIso.y + TILE_H / 2;

      ctx.save();
      if (item.type === 'desk') {
        // Modern Minimalist Desk with Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(fx, fy - 2 * dpr, 24 * dpr, 12 * dpr, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(fx - 22 * dpr, fy - 22 * dpr, 3 * dpr, 18 * dpr);
        ctx.fillRect(fx + 19 * dpr, fy - 22 * dpr, 3 * dpr, 18 * dpr);

        // Desk Surface
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.moveTo(fx, fy - 16 * dpr);
        ctx.lineTo(fx + 26 * dpr, fy - 29 * dpr);
        ctx.lineTo(fx, fy - 42 * dpr);
        ctx.lineTo(fx - 26 * dpr, fy - 29 * dpr);
        ctx.closePath();
        ctx.fill();

        // Glowing Dual Monitor Display
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(fx - 8 * dpr, fy - 45 * dpr, 16 * dpr, 10 * dpr);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fx - 6 * dpr, fy - 43 * dpr, 12 * dpr, 6 * dpr);
      } else if (item.type === 'bed') {
        // Wooden Bed Base
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + 30 * dpr, fy - 15 * dpr);
        ctx.lineTo(fx, fy - 30 * dpr);
        ctx.lineTo(fx - 30 * dpr, fy - 15 * dpr);
        ctx.closePath();
        ctx.fill();

        // Neon Duvet Quilt
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.moveTo(fx, fy - 5 * dpr);
        ctx.lineTo(fx + 26 * dpr, fy - 18 * dpr);
        ctx.lineTo(fx, fy - 31 * dpr);
        ctx.lineTo(fx - 26 * dpr, fy - 18 * dpr);
        ctx.closePath();
        ctx.fill();

        // White Bed Pillows
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fx - 14 * dpr, fy - 30 * dpr, 12 * dpr, 6 * dpr);
      } else if (item.type === 'sofa') {
        // Lounge Couch Cushion
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        ctx.roundRect(fx - 24 * dpr, fy - 26 * dpr, 48 * dpr, 22 * dpr, 6 * dpr);
        ctx.fill();
        ctx.fillStyle = '#6366f1';
        ctx.beginPath();
        ctx.roundRect(fx - 20 * dpr, fy - 20 * dpr, 40 * dpr, 14 * dpr, 4 * dpr);
        ctx.fill();
      } else if (item.type === 'plant') {
        // Terracotta Pot
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(fx, fy - 8 * dpr, 8 * dpr, 0, Math.PI * 2);
        ctx.fill();

        // Monstera Foliage
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(fx - 6 * dpr, fy - 19 * dpr, 8 * dpr, 0, Math.PI * 2);
        ctx.arc(fx + 6 * dpr, fy - 21 * dpr, 9 * dpr, 0, Math.PI * 2);
        ctx.arc(fx, fy - 26 * dpr, 10 * dpr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderAvatar(char, isSelf, ox, oy) {
      const pIso = toIso(char.gx, char.gy);
      const ax = ox + pIso.x;
      const ay = oy + pIso.y + TILE_H / 2;

      // Drop Shadow
      ctx.beginPath();
      ctx.ellipse(ax, ay, 16 * dpr, 8 * dpr, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fill();

      const walkBob = char.isMoving ? Math.sin(Date.now() * 0.02) * (4 * dpr) : 0;
      const sitOffset = char.isSitting ? 8 * dpr : 0;

      // Legs
      if (!char.isSitting) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(ax - 6 * dpr, ay - 10 * dpr + walkBob, 4 * dpr, 9 * dpr);
        ctx.fillRect(ax + 2 * dpr, ay - 10 * dpr - walkBob, 4 * dpr, 9 * dpr);
      }

      // Body / Outfit
      ctx.fillStyle = char.outfitColor;
      ctx.beginPath();
      ctx.roundRect(ax - 10 * dpr, ay - 28 * dpr + walkBob + sitOffset, 20 * dpr, 18 * dpr, 5 * dpr);
      ctx.fill();

      // Head
      ctx.fillStyle = char.skinColor || '#fcd34d';
      ctx.beginPath();
      ctx.arc(ax, ay - 38 * dpr + walkBob + sitOffset, 12 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = char.hairColor;
      ctx.beginPath();
      ctx.arc(ax, ay - 41 * dpr + walkBob + sitOffset, 13 * dpr, Math.PI, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#000000';
      ctx.fillRect(ax - 4 * dpr, ay - 37 * dpr + walkBob + sitOffset, 2.5 * dpr, 3.5 * dpr);
      ctx.fillRect(ax + 2 * dpr, ay - 37 * dpr + walkBob + sitOffset, 2.5 * dpr, 3.5 * dpr);

      // Emote
      if (char.emoteTimer > 0) {
        ctx.font = `${22 * dpr}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(char.emote, ax, ay - 58 * dpr + walkBob + sitOffset);
      }

      // Chat Bubble
      if (char.bubbleTimer > 0 && char.bubbleText) {
        ctx.font = `bold ${10 * dpr}px sans-serif`;
        const textWidth = ctx.measureText(char.bubbleText).width;
        const bubbleW = textWidth + 16 * dpr;
        const bubbleH = 22 * dpr;
        const bx = ax - bubbleW / 2;
        const by = ay - 68 * dpr + walkBob + sitOffset;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.strokeStyle = isSelf ? '#ec4899' : '#06b6d4';
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath();
        ctx.roundRect(bx, by, bubbleW, bubbleH, 6 * dpr);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(char.bubbleText, ax, by + 15 * dpr);
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      const ox = W / 2;
      const oy = (H / 2) - 10 * dpr;

      // Isometric Walls
      const cornerTop = toIso(0, 0);
      const cornerLeft = toIso(0, GRID_SIZE);
      const cornerRight = toIso(GRID_SIZE, 0);

      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerLeft.x, oy + cornerLeft.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#2e1065';
      ctx.beginPath();
      ctx.moveTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y - WALL_H);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Cyber Neon Window
      const winGrad = ctx.createLinearGradient(ox - 60 * dpr, oy - 120 * dpr, ox - 10 * dpr, oy - 45 * dpr);
      winGrad.addColorStop(0, 'rgba(6, 182, 212, 0.45)');
      winGrad.addColorStop(1, 'rgba(236, 72, 153, 0.25)');
      ctx.fillStyle = winGrad;
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      ctx.moveTo(ox - 60 * dpr, oy - 120 * dpr);
      ctx.lineTo(ox - 10 * dpr, oy - 95 * dpr);
      ctx.lineTo(ox - 10 * dpr, oy - 45 * dpr);
      ctx.lineTo(ox - 60 * dpr, oy - 70 * dpr);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Neon Trim
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 2.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(ox + cornerLeft.x, oy + cornerLeft.y);
      ctx.lineTo(ox + cornerTop.x, oy + cornerTop.y);
      ctx.lineTo(ox + cornerRight.x, oy + cornerRight.y);
      ctx.stroke();

      // Floor Grid
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const iso = toIso(x, y);
          const px = ox + iso.x;
          const py = oy + iso.y;

          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + TILE_W / 2, py + TILE_H / 2);
          ctx.lineTo(px, py + TILE_H);
          ctx.lineTo(px - TILE_W / 2, py + TILE_H / 2);
          ctx.closePath();

          ctx.fillStyle = ((x + y) % 2 === 0) ? '#0f172a' : '#1e293b';
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1 * dpr;
          ctx.stroke();
        }
      }

      // Ambient Dust Motes
      ctx.fillStyle = 'rgba(236, 72, 153, 0.35)';
      for (let m of motes) {
        ctx.beginPath();
        ctx.arc(m.x % W, m.y % H, m.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Target Movement Circle
      if (player.isMoving) {
        const tIso = toIso(player.targetGx, player.targetGy);
        const tx = ox + tIso.x;
        const ty = oy + tIso.y + TILE_H / 2;
        ctx.beginPath();
        ctx.ellipse(tx, ty, 16 * dpr, 8 * dpr, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2 * dpr;
        ctx.stroke();
      }

      // Depth Sorted Rendering
      const renderList = [
        ...furniture.map(f => ({ type: 'furniture', data: f, depth: f.gx + f.gy })),
        ...friends.map(fr => ({ type: 'friend', data: fr, depth: fr.gx + fr.gy })),
        { type: 'player', data: player, depth: player.gx + player.gy }
      ];

      renderList.sort((a, b) => a.depth - b.depth);

      for (let ent of renderList) {
        if (ent.type === 'furniture') {
          render3DFurniture(ent.data, ox, oy);
        } else if (ent.type === 'friend') {
          renderAvatar(ent.data, false, ox, oy);
        } else {
          renderAvatar(ent.data, true, ox, oy);
        }
      }

      update();
      requestAnimationFrame(render);
    }

    // 4. Tap to Walk & Furniture Deletion / Pickup
    canvas.addEventListener('pointerdown', (e) => {
      closeAllModals();
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const coord = fromIso(clickX, clickY);
      const tx = Math.round(coord.gx);
      const ty = Math.round(coord.gy);

      if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
        // If clicking existing furniture, prompt to pickup/delete
        const hitIndex = furniture.findIndex(f => f.gx === tx && f.gy === ty);
        if (hitIndex !== -1 && hitIndex !== null) {
          const conf = confirm(`Remove ${furniture[hitIndex].type}?`);
          if (conf) {
            furniture.splice(hitIndex, 1);
            saveDecorState();
            return;
          }
        }

        player.targetGx = tx;
        player.targetGy = ty;
        player.isMoving = true;
      }
    });

    function toggleModal(id) {
      const el = document.getElementById(id);
      const isHidden = el.classList.contains('hidden');
      closeAllModals();
      if (isHidden) el.classList.remove('hidden');
    }

    function closeAllModals() {
      document.getElementById('wardrobeModal').classList.add('hidden');
      document.getElementById('decorModal').classList.add('hidden');
    }

    // 5. Wardrobe Persistence
    function setHair(c) {
      player.hairColor = c;
      localStorage.setItem('oiioii_hair', c);
    }

    function setOutfit(c) {
      player.outfitColor = c;
      localStorage.setItem('oiioii_outfit', c);
    }

    function addFurniture(type) {
      furniture.push({ type, gx: Math.round(player.gx), gy: Math.round(player.gy) });
      saveDecorState();
      closeAllModals();
    }

    function triggerEmote(em) {
      player.emote = em;
      player.emoteTimer = 90;
    }

    function handleChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (val) {
        player.bubbleText = val;
        player.bubbleTimer = 180;
        input.value = '';
      }
    }

    function centerPlayer() {
      player.targetGx = 4;
      player.targetGy = 4;
      player.isMoving = true;
    }

    render();
  </script>
</body>
</html>
