<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Oiioii Space • Virtual World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 font-sans select-none overflow-hidden">

  <header class="w-full max-w-md flex items-center justify-between px-3 py-2 bg-slate-900/90 backdrop-blur rounded-2xl border border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <h1 class="text-xs font-black text-pink-400 tracking-wide">Oiioii Space</h1>
    </div>
    <div class="flex gap-1.5">
      <button onclick="toggleWardrobe()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-bold rounded-lg border border-slate-700 text-slate-200">
        👗 Style
      </button>
      <button onclick="toggleDecor()" class="px-2.5 py-1 bg-pink-500 hover:bg-pink-600 text-[11px] font-black rounded-lg text-slate-950 shadow-md shadow-pink-500/20">
        🛋️ Decor
      </button>
    </div>
  </header>

  <div class="relative w-full max-w-md flex-1 my-2 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden">
    <canvas id="spaceCanvas" class="w-full h-full object-cover"></canvas>

    <div class="absolute bottom-3 left-3 right-3 flex justify-between pointer-events-none">
      <button onclick="centerCamera()" class="pointer-events-auto px-3 py-1.5 bg-slate-950/80 backdrop-blur text-[11px] font-bold rounded-xl border border-slate-800 text-slate-300">
        Center 🎯
      </button>
      <div class="flex gap-2 pointer-events-auto">
        <button onclick="sendEmote('💖')" class="px-2.5 py-1.5 bg-slate-950/80 backdrop-blur text-sm rounded-xl border border-slate-800">💖</button>
        <button onclick="sendEmote('👋')" class="px-2.5 py-1.5 bg-slate-950/80 backdrop-blur text-sm rounded-xl border border-slate-800">👋</button>
        <button onclick="sendEmote('✨')" class="px-2.5 py-1.5 bg-slate-950/80 backdrop-blur text-sm rounded-xl border border-slate-800">✨</button>
      </div>
    </div>

    <div id="wardrobeModal" class="hidden absolute inset-x-2 bottom-2 bg-slate-950/95 backdrop-blur-md p-3 rounded-2xl border border-pink-500/30 space-y-2 z-30">
      <div class="flex justify-between items-center">
        <span class="text-xs font-black text-pink-400">Avatar Customizer</span>
        <button onclick="toggleWardrobe()" class="text-xs text-slate-400">✕</button>
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Hair:</span>
        <div class="flex gap-1.5">
          <button onclick="setHair('#1e293b')" class="w-5 h-5 rounded-full bg-slate-800 border border-white/50"></button>
          <button onclick="setHair('#f59e0b')" class="w-5 h-5 rounded-full bg-amber-500 border border-white/50"></button>
          <button onclick="setHair('#ec4899')" class="w-5 h-5 rounded-full bg-pink-500 border border-white/50"></button>
          <button onclick="setHair('#06b6d4')" class="w-5 h-5 rounded-full bg-cyan-500 border border-white/50"></button>
        </div>
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Outfit:</span>
        <div class="flex gap-1.5">
          <button onclick="setOutfit('#f43f5e')" class="w-5 h-5 rounded-full bg-rose-500 border border-white/50"></button>
          <button onclick="setOutfit('#8b5cf6')" class="w-5 h-5 rounded-full bg-purple-500 border border-white/50"></button>
          <button onclick="setOutfit('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 border border-white/50"></button>
          <button onclick="setOutfit('#f8fafc')" class="w-5 h-5 rounded-full bg-white border border-white/50"></button>
        </div>
      </div>
    </div>

    <div id="decorModal" class="hidden absolute inset-x-2 bottom-2 bg-slate-950/95 backdrop-blur-md p-3 rounded-2xl border border-pink-500/30 space-y-2 z-30">
      <div class="flex justify-between items-center">
        <span class="text-xs font-black text-pink-400">Place Furniture</span>
        <button onclick="toggleDecor()" class="text-xs text-slate-400">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2 text-[11px]">
        <button onclick="addFurniture('table')" class="p-2 bg-slate-800 rounded-xl border border-slate-700 text-center">💻 Desk</button>
        <button onclick="addFurniture('plant')" class="p-2 bg-slate-800 rounded-xl border border-slate-700 text-center">🪴 Plant</button>
        <button onclick="addFurniture('sofa')" class="p-2 bg-slate-800 rounded-xl border border-slate-700 text-center">🛋️ Sofa</button>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Isometric Grid Dimensions
    const GRID_SIZE = 7;
    const TILE_W = 100 * (window.devicePixelRatio || 1);
    const TILE_H = 50 * (window.devicePixelRatio || 1);
    const WALL_H = 120 * (window.devicePixelRatio || 1);

    // Player State
    const player = {
      gx: 3, gy: 3,
      targetGx: 3, targetGy: 3,
      speed: 0.08,
      isMoving: false,
      skinColor: '#fcd34d',
      hairColor: '#ec4899',
      outfitColor: '#8b5cf6',
      emote: null,
      emoteTimer: 0
    };

    // Placed Furniture Items
    const furniture = [
      { type: 'table', gx: 1, gy: 1 },
      { type: 'plant', gx: 5, gy: 1 },
      { type: 'sofa', gx: 1, gy: 5 }
    ];

    function toIso(gx, gy) {
      return {
        x: (gx - gy) * (TILE_W / 2),
        y: (gx + gy) * (TILE_H / 2)
      };
    }

    function fromIso(screenX, screenY) {
      const originX = W / 2;
      const originY = H / 2 - 30;
      const relX = screenX - originX;
      const relY = screenY - originY;
      const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
      const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
      return { gx, gy };
    }

    function update() {
      if (player.isMoving) {
        const dx = player.targetGx - player.gx;
        const dy = player.targetGy - player.gy;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.05) {
          player.gx = player.targetGx;
          player.gy = player.targetGy;
          player.isMoving = false;
        } else {
          player.gx += (dx / dist) * player.speed;
          player.gy += (dy / dist) * player.speed;
        }
      }

      if (player.emoteTimer > 0) {
        player.emoteTimer--;
        if (player.emoteTimer <= 0) player.emote = null;
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      const ox = W / 2;
      const oy = H / 2 - 30;

      // 1. Draw 3D Isometric Back Walls
      // Left Wall
      const topCorner = toIso(0, 0);
      const leftCorner = toIso(0, GRID_SIZE);
      const rightCorner = toIso(GRID_SIZE, 0);

      ctx.fillStyle = '#1e1b4b'; // Neon deep purple wall
      ctx.beginPath();
      ctx.moveTo(ox + topCorner.x, oy + topCorner.y);
      ctx.lineTo(ox + leftCorner.x, oy + leftCorner.y);
      ctx.lineTo(ox + leftCorner.x, oy + leftCorner.y - WALL_H);
      ctx.lineTo(ox + topCorner.x, oy + topCorner.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Right Wall
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.moveTo(ox + topCorner.x, oy + topCorner.y);
      ctx.lineTo(ox + rightCorner.x, oy + rightCorner.y);
      ctx.lineTo(ox + rightCorner.x, oy + rightCorner.y - WALL_H);
      ctx.lineTo(ox + topCorner.x, oy + topCorner.y - WALL_H);
      ctx.closePath();
      ctx.fill();

      // Wall Trim Neon Line
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ox + leftCorner.x, oy + leftCorner.y);
      ctx.lineTo(ox + topCorner.x, oy + topCorner.y);
      ctx.lineTo(ox + rightCorner.x, oy + rightCorner.y);
      ctx.stroke();

      // 2. Draw Floor Tiles
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const iso = toIso(x, y);
          const px = ox + iso.x;
          const py = oy + iso.y;

          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + TILE_W / 2, py + TILE_H / 2);
          ctx.lineTo(px, py + TILE_H);
          ctx.lineTo(px - TILE_W / 2, py + TILE_H / 2);
          ctx.closePath();

          ctx.fillStyle = ((x + y) % 2 === 0) ? '#0f172a' : '#1e293b';
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // 3. Draw Placed Furniture
      for (let item of furniture) {
        const fIso = toIso(item.gx, item.gy);
        const fx = ox + fIso.x;
        const fy = oy + fIso.y + TILE_H / 2;

        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        if (item.type === 'table') ctx.fillText('💻', fx, fy - 10);
        if (item.type === 'plant') ctx.fillText('🪴', fx, fy - 10);
        if (item.type === 'sofa') ctx.fillText('🛋️', fx, fy - 10);
      }

      // 4. Draw Player Avatar (Oiioii Chibi Character)
      const pIso = toIso(player.gx, player.gy);
      const ax = ox + pIso.x;
      const ay = oy + pIso.y + TILE_H / 2;

      // Shadow
      ctx.beginPath();
      ctx.ellipse(ax, ay, 20, 10, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fill();

      const walkBob = player.isMoving ? Math.sin(Date.now() * 0.02) * 5 : 0;

      // Legs / Shoes
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(ax - 7, ay - 12 + walkBob, 5, 10);
      ctx.fillRect(ax + 2, ay - 12 - walkBob, 5, 10);

      // Body / Outfit
      ctx.fillStyle = player.outfitColor;
      ctx.beginPath();
      ctx.roundRect(ax - 12, ay - 32 + walkBob, 24, 22, 6);
      ctx.fill();

      // Head
      ctx.fillStyle = player.skinColor;
      ctx.beginPath();
      ctx.arc(ax, ay - 44 + walkBob, 14, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = player.hairColor;
      ctx.beginPath();
      ctx.arc(ax, ay - 48 + walkBob, 15, Math.PI, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#000000';
      ctx.fillRect(ax - 5, ay - 43 + walkBob, 3, 4);
      ctx.fillRect(ax + 2, ay - 43 + walkBob, 3, 4);

      // Emote Bubble
      if (player.emote) {
        ctx.font = '22px sans-serif';
        ctx.fillText(player.emote, ax, ay - 68 + walkBob);
      }

      update();
      requestAnimationFrame(render);
    }

    // Tap to Walk
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const gridCoord = fromIso(clickX, clickY);
      const tx = Math.round(gridCoord.gx);
      const ty = Math.round(gridCoord.gy);

      if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
        player.targetGx = tx;
        player.targetGy = ty;
        player.isMoving = true;
      }
    });

    function toggleWardrobe() {
      document.getElementById('decorModal').classList.add('hidden');
      document.getElementById('wardrobeModal').classList.toggle('hidden');
    }

    function toggleDecor() {
      document.getElementById('wardrobeModal').classList.add('hidden');
      document.getElementById('decorModal').classList.toggle('hidden');
    }

    function setHair(color) { player.hairColor = color; }
    function setOutfit(color) { player.outfitColor = color; }

    function addFurniture(type) {
      furniture.push({ type, gx: Math.floor(player.gx), gy: Math.floor(player.gy) });
      toggleDecor();
    }

    function sendEmote(symbol) {
      player.emote = symbol;
      player.emoteTimer = 90;
    }

    function centerCamera() {
      player.targetGx = 3;
      player.targetGy = 3;
      player.isMoving = true;
    }

    render();
  </script>
</body>
</html>
