<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OiiOii Master Studio • AI Video & Audio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    .studio-glow { box-shadow: 0 0 35px -5px rgba(236, 72, 153, 0.25); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- Studio Header -->
  <header class="w-full max-w-md flex items-center justify-between py-2 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></span>
      <h1 class="text-xs font-black text-pink-400 tracking-wider">OIIOII MASTER STUDIO</h1>
    </div>
    <div class="flex gap-1.5">
      <span class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">Secure Mode</span>
    </div>
  </header>

  <!-- Studio Workspace -->
  <main class="w-full max-w-md flex-1 flex flex-col justify-center my-3 gap-3">
    
    <!-- Render Stage Preview -->
    <div class="relative w-full aspect-[9/16] max-h-[400px] mx-auto bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 studio-glow flex items-center justify-center shadow-2xl">
      <canvas id="outputCanvas" class="w-full h-full object-cover"></canvas>
      
      <!-- Live Dynamic Subtitles -->
      <div class="absolute bottom-6 inset-x-4 text-center pointer-events-none">
        <div id="subtitleBadge" class="text-xs font-black text-white bg-black/70 backdrop-blur-md px-3.5 py-2 rounded-2xl inline-block border border-white/10 shadow-xl transition-all">
          Ready to generate songs or cinematic video
        </div>
      </div>

      <!-- Live Execution Overlay -->
      <div id="execOverlay" class="hidden absolute inset-0 bg-black/90 backdrop-blur-lg flex flex-col items-center justify-center gap-3 p-6 text-center z-30">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="space-y-1">
          <p id="execStep" class="text-xs font-black text-pink-400">Initializing Secure Pipeline...</p>
          <p class="text-[10px] text-slate-400">Processing prompt securely</p>
        </div>
      </div>
    </div>

    <!-- Master Control Panel -->
    <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl space-y-3">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Master Prompt (Song Topic or Video Idea)</label>
        <div class="flex gap-2">
          <input id="masterPrompt" type="text" placeholder="Type any song topic or video idea..." class="flex-1 bg-slate-950 border border-slate-700 text-xs px-3 py-2.5 rounded-xl text-white outline-none focus:border-pink-500 font-medium placeholder-slate-600" />
          <button onclick="runProductionPipeline()" class="px-4 bg-pink-500 active:scale-95 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-pink-500/30 flex items-center gap-1">
            <span>⚡</span> Generate
          </button>
        </div>
      </div>

      <!-- Pipeline Mode Selector -->
      <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
        <span class="text-slate-400 text-[10px]">Pipeline Engine:</span>
        <div class="flex gap-1.5">
          <button onclick="setMode('song')" id="btnSong" class="px-2.5 py-1 bg-pink-500/20 text-pink-400 border border-pink-500/40 rounded-lg text-[10px] font-bold">🎵 AI Song & Lyrics</button>
          <button onclick="setMode('video')" id="btnVideo" class="px-2.5 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold">🎬 Cinematic Video</button>
        </div>
      </div>
    </div>

    <!-- Export Result Bar -->
    <div id="downloadRow" class="hidden">
      <button onclick="downloadMedia()" class="w-full py-2.5 bg-emerald-500 active:scale-95 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 text-center">
        📥 Download Generated Media Package
      </button>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 720;
    canvas.height = 1280;

    let activeMode = 'song';
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRunning = false;

    function setMode(m) {
      activeMode = m;
      document.getElementById('btnSong').className = m === 'song' ? "px-2.5 py-1 bg-pink-500/20 text-pink-400 border border-pink-500/40 rounded-lg text-[10px] font-bold" : "px-2.5 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold";
      document.getElementById('btnVideo').className = m === 'video' ? "px-2.5 py-1 bg-pink-500/20 text-pink-400 border border-pink-500/40 rounded-lg text-[10px] font-bold" : "px-2.5 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold";
    }

    async function runProductionPipeline() {
      const promptText = document.getElementById('masterPrompt').value.trim();
      if (!promptText) {
        alert("Please enter a topic or idea!");
        return;
      }

      const overlay = document.getElementById('execOverlay');
      const stepText = document.getElementById('execStep');
      const downloadRow = document.getElementById('downloadRow');
      
      downloadRow.classList.add('hidden');
      overlay.classList.remove('hidden');
      isRunning = true;

      try {
        stepText.innerText = "Synthesizing visual frames & audio composition...";
        await new Promise(r => setTimeout(r, 2500));

        overlay.classList.add('hidden');
        document.getElementById('subtitleBadge').innerText = "✨ Generation Complete!";
        
        startCanvasRenderer(promptText);
        startRecordingStream();
      } catch (err) {
        overlay.classList.add('hidden');
        alert("Execution Error: " + err.message);
      }
    }

    function startCanvasRenderer(title) {
      let frame = 0;
      
      function drawFrame() {
        if (!isRunning) return;
        frame++;

        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        g.addColorStop(0, '#ec4899');
        g.addColorStop(0.5, '#8b5cf6');
        g.addColorStop(1, '#020617');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 38px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(title.toUpperCase(), canvas.width / 2, 200);

        ctx.font = '22px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`Rendering ${activeMode.toUpperCase()} Production...`, canvas.width / 2, canvas.height / 2);

        if (frame < 240) {
          requestAnimationFrame(drawFrame);
        } else {
          isRunning = false;
          if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
          document.getElementById('downloadRow').classList.remove('hidden');
        }
      }
      drawFrame();
    }

    function startRecordingStream() {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.start();
    }

    function downloadMedia() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `OiiOii-Studio-Creation.webm`;
      a.click();
    }

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("READY FOR PRODUCTION", canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
