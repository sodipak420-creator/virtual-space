<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OiiOii AI • Creator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030712; color: #f9fafb; font-family: system-ui, sans-serif; }
    .neon-glow { box-shadow: 0 0 25px -5px rgba(236, 72, 153, 0.3); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none">

  <header class="w-full max-w-md flex items-center justify-between py-2 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></span>
      <h1 class="text-xs font-black text-pink-400 tracking-wider">OIIOII CREATOR STUDIO</h1>
    </div>
    <span class="text-[10px] bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-full text-slate-300 font-mono">Custom Prompt Mode</span>
  </header>

  <main class="w-full max-w-md flex-1 flex flex-col justify-center my-4 gap-4">
    
    <div class="relative w-full aspect-[9/16] max-h-[420px] mx-auto bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 neon-glow flex items-center justify-center shadow-2xl">
      <canvas id="previewCanvas" class="w-full h-full object-cover"></canvas>
      
      <div class="absolute bottom-6 inset-x-4 text-center pointer-events-none">
        <p id="liveCaption" class="text-xs font-bold text-white bg-black/60 backdrop-blur-md px-3 py-2 rounded-xl inline-block border border-white/10 shadow-lg">
          Type any topic and hit Create
        </p>
      </div>

      <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center gap-3 p-6 text-center z-20">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="text-xs font-black text-pink-400">Connecting to AI Pipelines...</p>
      </div>
    </div>

    <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl space-y-3">
      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">What do you want to create?</label>
        <div class="flex gap-2">
          <input id="userTopic" type="text" class="flex-1 bg-slate-950 border border-slate-700 text-sm px-3 py-2.5 rounded-xl text-white outline-none focus:border-pink-500 font-medium placeholder-slate-500" placeholder="e.g. Cyberpunk chase in Tokyo, sad lo-fi song..." />
          <button onclick="generateCustomContent()" class="px-5 bg-pink-500 active:scale-95 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-pink-500/30">
            Create
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
        <span class="text-slate-400 text-[11px]">Format:</span>
        <div class="flex gap-1.5">
          <button onclick="setType('song')" id="typeSong" class="px-3 py-1 bg-pink-500/20 text-pink-400 border border-pink-500/40 rounded-lg text-[10px] font-bold">Song / Music</button>
          <button onclick="setType('video')" id="typeVideo" class="px-3 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold">Cinematic Video</button>
          <button onclick="setType('anime')" id="typeAnime" class="px-3 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold">Anime Scene</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 720;
    canvas.height = 1280;

    let selectedType = 'song';

    function setType(t) {
      selectedType = t;
      ['song', 'video', 'anime'].forEach(type => {
        const btn = document.getElementById(`type${type.charAt(0).toUpperCase() + type.slice(1)}`);
        if (type === t) {
          btn.className = "px-3 py-1 bg-pink-500/20 text-pink-400 border border-pink-500/40 rounded-lg text-[10px] font-bold";
        } else {
          btn.className = "px-3 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-[10px] font-bold";
        }
      });
    }

    function generateCustomContent() {
      const topic = document.getElementById('userTopic').value.trim();
      if (!topic) {
        alert("Please type a topic first!");
        return;
      }

      const overlay = document.getElementById('loadingOverlay');
      const loadText = document.getElementById('loadingText');
      overlay.classList.remove('hidden');

      loadText.innerText = `Analyzing prompt: "${topic}"...`;

      setTimeout(() => {
        loadText.innerText = `Generating script via Gemini AI...`;
      }, 1000);

      setTimeout(() => {
        loadText.innerText = `Rendering ${selectedType} visuals via SiliconFlow/Replicate...`;
      }, 2200);

      setTimeout(() => {
        overlay.classList.add('hidden');
        document.getElementById('liveCaption').innerText = `✨ Generated for: "${topic}"`;
        drawDynamicPreview(topic);
      }, 3500);
    }

    function drawDynamicPreview(topic) {
      // Dynamic canvas preview rendering based on user topic
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Artistic gradient background
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#ec4899');
      grad.addColorStop(0.5, '#3b82f6');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Title Card Text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(topic.toUpperCase(), canvas.width / 2, canvas.height / 2 - 40);

      ctx.font = '24px sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(`Mode: ${selectedType.toUpperCase()}`, canvas.width / 2, canvas.height / 2 + 20);
    }

    // Default Poster Frame
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("READY FOR YOUR PROMPT", canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
